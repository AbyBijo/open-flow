name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets are read once here at job level. Steps below test env.*,
      # because the secrets context is not allowed in a step-level if.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Do NOT use android-actions/setup-android here: on ubuntu-latest
      # runners it fails with "Failed to find package 'tools'" and exits 1.
      # The runner already has an Android SDK at $ANDROID_HOME, so use it
      # directly and install only the packages this app needs.
      - name: Install Android 36 + NDK + CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMGR="sdkmanager"
          fi
          yes | "$SDKMGR" --licenses || true
          yes | "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode signing keystore (only if secrets are set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release (signed only if keystore secrets are set)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release artifacts
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: openflow-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
